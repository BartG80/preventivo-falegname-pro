workflows:
  android-apk:
    name: Android APK
    max_build_duration: 60
    
    environment:
      vars:
        NODE_VERSION: 20
      node: 20.20.0
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Set app icon (gold plane)
        script: |
          echo "Icon will be set from repo - if you uploaded master-1024.png"
      - name: Build APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk
